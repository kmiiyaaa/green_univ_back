name: Backend CI/CD

on:
  push:
    branches:
      - km-251222-build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml <<'EOF'
          server:
            port: 8888

          spring:
            jackson:
              time-zone: Asia/Seoul

            datasource:
              driver-class-name: com.mysql.cj.jdbc.Driver
              url: ${MYSQL_URL}
              username: admin
              password: ${MYSQL_PASSWORD}

            jpa:
              hibernate:
                ddl-auto: update
              properties:
                hibernate:
                  format_sql: true

          jwt:
            secret: ${JWT_SECRET}

          app:
            ai:
              mistral:
                api-key: ${MISTRAL_API_KEY}
                url: https://api.mistral.ai/v1
              gemini:
                api-key: ${GEMINI_API_KEY}
                url: https://generativelanguage.googleapis.com/v1beta
          EOF
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Spring Boot (skip test)
        run: ./gradlew clean build -x test

      - name: Copy Jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "build/libs/*.jar"
          target: "/home/ubuntu/greenuniv/build/libs/"
          overwrite: true

      - name: Activate Jar and Restart Service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            echo "==> jars on server"
            ls -al /home/ubuntu/greenuniv/build/libs

            echo "==> set app.jar"
            JAR=$(ls -1 /home/ubuntu/greenuniv/build/libs/*.jar | head -n 1)
            sudo cp -f "$JAR" /home/ubuntu/greenuniv/build/libs/app.jar
            ls -al /home/ubuntu/greenuniv/build/libs/app.jar

            echo "==> reload & restart"
            sudo systemctl daemon-reload
            sudo systemctl restart backend.service
            sudo systemctl status backend.service --no-pager

            echo "==> last logs"
            sudo journalctl -u backend.service -n 80 --no-pager
