name: Backend CI/CD

on:
  push:
    branches:
      - km-251222-build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create application.yml (render secrets)
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          mkdir -p src/main/resources
          python3 - <<'PY'
          import os, pathlib
          y = f"""server:
            port: 8888

          spring:
            jackson:
              time-zone: Asia/Seoul

            datasource:
              driver-class-name: com.mysql.cj.jdbc.Driver
              url: "{os.environ['MYSQL_URL']}"
              username: admin
              password: "{os.environ['MYSQL_PASSWORD']}"

            jpa:
              hibernate:
                ddl-auto: update
              properties:
                hibernate:
                  format_sql: true

          jwt:
            secret: "{os.environ['JWT_SECRET']}"

          app:
            ai:
              mistral:
                api-key: "{os.environ['MISTRAL_API_KEY']}"
                url: "https://api.mistral.ai/v1"
              gemini:
                api-key: "{os.environ['GEMINI_API_KEY']}"
                url: "https://generativelanguage.googleapis.com/v1beta"
          """
          pathlib.Path("src/main/resources/application.yml").write_text(y, encoding="utf-8")
          print("application.yml created")
          PY

      - name: Build Spring Boot (skip test)
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: Prepare deploy jar
        run: |
          set -e
          mkdir -p deploy
          JAR="$(find . -type f -path '*/build/libs/*.jar' ! -name '*-plain.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No jar found"
            find . -maxdepth 6 -type f -name "*.jar" -print
            exit 1
          fi
          echo "Found jar: $JAR"
          cp "$JAR" deploy/app.jar
          ls -al deploy

      - name: Copy Jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: deploy/app.jar
          target: /home/ubuntu/greenuniv/build/libs/
          overwrite: true

      - name: Activate Jar and Restart Service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            if [ -f /home/ubuntu/greenuniv/build/libs/deploy/app.jar ]; then
              sudo mv -f /home/ubuntu/greenuniv/build/libs/deploy/app.jar /home/ubuntu/greenuniv/build/libs/app.jar
              sudo rmdir /home/ubuntu/greenuniv/build/libs/deploy || true
            fi

            if [ ! -f /home/ubuntu/greenuniv/build/libs/app.jar ]; then
              echo "app.jar not found"
              ls -al /home/ubuntu/greenuniv/build/libs
              exit 1
            fi

            sudo chown ubuntu:ubuntu /home/ubuntu/greenuniv/build/libs/app.jar
            sudo systemctl daemon-reload
            sudo systemctl restart backend.service
            sudo systemctl status backend.service --no-pager
            sudo journalctl -u backend.service -n 80 --no-pager
